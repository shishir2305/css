<!doctype html>
<html>
  <head>
    <style>
      /* CSS is used to style HTML elements.
       It controls colors, fonts, spacing, size, layout, etc. */

      h1 {
        color: blue; /* Text color */
        font-size: 40px; /* Text size */
      }

      p {
        color: gray; /* Paragraph text color */
      }
    </style>
  </head>

  <body>
    <h1>Hello CSS</h1>
    <p>CSS makes HTML look better.</p>
  </body>
</html>

<!-- 
1. Browser receives HTML, CSS, and JavaScript.
2. HTML is parsed → DOM (Document Object Model) is created.
3. CSS is parsed → CSSOM (CSS Object Model) is created.
4. Browser combines DOM + CSSOM → creates the Render Tree.
5. Browser performs Style Calculation → determines which CSS rules apply.
6. Layout (Reflow) → calculates each element's size and position.
7. Paint → draws text, colors, borders, backgrounds, shadows, etc.
8. Compositing → combines different layers.
9. Final pixels are displayed on the screen.
-->
